name: LCP skeleton checks
on:
  push:
    branches: [feat/plat-000-s1-platform-skeleton]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_USER: lcp_s1
          POSTGRES_PASSWORD: ci-synthetic-database-only
          POSTGRES_DB: lcp_s1_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lcp_s1 -d lcp_s1_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LCP_DB_USER: lcp_s1
      LCP_DB_PASSWORD: ci-synthetic-database-only
      LCP_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/lcp_s1_test
      LCP_DB_URL: jdbc:postgresql://127.0.0.1:5432/lcp_s1_dev
      LCP_BOOTSTRAP_ADMIN_PASSWORD: ci-synthetic-admin-only-123
      LCP_BOOTSTRAP_DEMO_PASSWORD: ci-synthetic-demo-only-123
      LCP_E2E_ADMIN_PASSWORD: ci-synthetic-admin-only-123
      LCP_E2E_DEMO_PASSWORD: ci-synthetic-demo-only-123
      LCP_SEED_EXAMPLE: 'true'
      PGPASSWORD: ci-synthetic-database-only
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.local/browsers
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Pin Maven build tool
        run: |
          mkdir -p .local/tools
          archive=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.tar.gz
          curl -fsSL "$archive" -o .local/tools/maven.tar.gz
          checksum=$(curl -fsSL "$archive.sha512")
          printf '%s  %s\n' "$checksum" '.local/tools/maven.tar.gz' | sha512sum -c -
          tar -xzf .local/tools/maven.tar.gz -C .local/tools
          echo "$GITHUB_WORKSPACE/.local/tools/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
      - name: Backend integration tests on real PostgreSQL
        run: mvn -B -f backend/pom.xml verify
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile --ignore-scripts
      - name: Web types, production build and lint
        run: |
          pnpm --dir web run build
          pnpm --dir web run lint
      - name: Install isolated browser
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser acceptance on real API
        run: |
          mkdir -p artifacts/platform-skeleton
          createdb -h 127.0.0.1 -p 5432 -U lcp_s1 lcp_s1_dev
          java -jar backend/target/lcp-platform-0.1.0-SNAPSHOT.jar > artifacts/platform-skeleton/backend-ci.log 2>&1 &
          backend_pid=$!
          pnpm --dir web run preview > artifacts/platform-skeleton/web-ci.log 2>&1 &
          web_pid=$!
          trap 'kill "$backend_pid" "$web_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8085/api/health && curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          pnpm --dir web run test:e2e
      - name: Preserve acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skeleton-acceptance
          path: |
            backend/target/surefire-reports/
            web/playwright-report/
            web/test-results/
            artifacts/platform-skeleton/
