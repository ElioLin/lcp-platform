server:
  address: ${LCP_BIND_ADDRESS:127.0.0.1}
  port: ${LCP_PORT:8085}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${LCP_COOKIE_SECURE:false}
spring:
  application:
    name: lcp-platform
  datasource:
    url: ${LCP_DB_URL:jdbc:postgresql://127.0.0.1:55433/lcp_s1_dev}
    username: ${LCP_DB_USER:lcp_s1}
    password: ${LCP_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 8
      connection-init-sql: SET TIME ZONE 'UTC'
  flyway:
    default-schema: lcp
    schemas: lcp
  jooq:
    sql-dialect: POSTGRES
  session:
    jdbc:
      initialize-schema: never
      table-name: lcp.spring_session
lcp:
  bootstrap:
    admin-password: ${LCP_BOOTSTRAP_ADMIN_PASSWORD:}
    demo-password: ${LCP_BOOTSTRAP_DEMO_PASSWORD:}
    seed-example: ${LCP_SEED_EXAMPLE:false}
logging:
  level:
    org.jooq.Constants: WARN
